[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "aibox-api"
version = "0.1.0"
description = "AIBox local-first AI model studio API with Whisper ASR and IndexTTS."
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "AIBox contributors" }]
dependencies = [
  "fastapi>=0.115,<1.0",
  "uvicorn[standard]>=0.30,<1.0",
  "python-multipart>=0.0.9",
  "psutil>=5.9",
  "grpcio>=1.70,<2.0",
  "grpcio-reflection>=1.70,<2.0",
  "httpx>=0.27,<1.0",
  "pyyaml>=6.0,<7.0",
  "pillow>=10.0,<12.0",
]

[project.optional-dependencies]
asr = [
  "faster-whisper>=1.1,<2.0",
  "av>=12,<19",
]
cuda12 = [
  "nvidia-cublas-cu12>=12.4,<13",
  "nvidia-cudnn-cu12>=9.1,<10",
  "nvidia-cuda-runtime-cu12>=12.4,<13",
  "nvidia-cuda-nvrtc-cu12>=12.4,<13",
]
dev = [
  "pytest>=8.0",
  "httpx>=0.27",
  "ruff>=0.6",
  "grpcio-tools>=1.70,<2.0",
]
desktop = [
  "pyinstaller>=6.0",
]

[project.scripts]
aibox = "aibox_api.__main__:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["aibox_api*"]

[tool.setuptools.package-data]
aibox_api = ["proto/*.proto", "assets/*.wav", "adapters_builtin/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = [
  "aibox_api/proto/aibox_asr_pb2.py",
  "aibox_api/proto/aibox_asr_pb2_grpc.py",
  "aibox_api/proto/aibox_tts_pb2.py",
  "aibox_api/proto/aibox_tts_pb2_grpc.py",
]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501", "B008"]

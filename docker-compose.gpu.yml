services:
  aibox:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        INSTALL_CUDA: "1"
    image: aibox:cuda12
    container_name: aibox-gpu
    ports:
      - "8765:8765"
      - "50051:50051"
      - "8060:8060/udp"
      - "8061:8061/tcp"
      - "50000-50100:50000-50100/udp"
    volumes:
      - aibox-data:/data
    environment:
      AIBOX_LOG_LEVEL: INFO
      AIBOX_GRPC_HOST: 0.0.0.0
      AIBOX_MRCP_HOST: 0.0.0.0
      AIBOX_MRCP_ADVERTISE_HOST: ${AIBOX_MRCP_ADVERTISE_HOST:-127.0.0.1}
      # AIBOX_API_TOKEN: ${AIBOX_API_TOKEN:-}
      # AIBOX_DEMO_TTS: "1"
      # AIBOX_INDEXTTS_HOME: /opt/index-tts
      # AIBOX_INDEXTTS_PYTHON: /opt/index-tts/.venv/bin/python
      # AIBOX_ALLOW_ADAPTER_COMMANDS: "1"
      # AIBOX_ALLOW_REMOTE_ADAPTERS: "1"
      # AIBOX_DEMO_IMAGE: "1"
      # AIBOX_COMFYUI_URL: http://host.docker.internal:8188
      # AIBOX_IMAGE_PYTHON: /opt/image-venv/bin/python
      # AIBOX_DEMO_SEPARATION: "1"
      # AIBOX_SEPARATION_PYTHON: /opt/separation-venv/bin/python
      # AIBOX_SEPARATION_DEVICE: auto
      # AIBOX_DEMO_VIDEO: "1"
      # MINIMAX_API_KEY: ${MINIMAX_API_KEY:-}
      # AIBOX_MINIMAX_BASE_URL: https://api.minimax.io/v1
      # AIBOX_MINIMAX_MODEL: MiniMax-H3
      # AIBOX_DEMO_LLM: "1"
      # AIBOX_LLAMA_SERVER: /opt/llama.cpp/build/bin/llama-server
      # AIBOX_LLM_BASE_URL: http://host.docker.internal:11434/v1
      # AIBOX_LLM_MODEL: qwen3-8b
      # AIBOX_LLM_CONTEXT: "8192"
      # AIBOX_LLM_GPU_LAYERS: "99"
      NVIDIA_VISIBLE_DEVICES: all
      NVIDIA_DRIVER_CAPABILITIES: compute,utility
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    restart: unless-stopped

volumes:
  aibox-data:
